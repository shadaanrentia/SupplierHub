name: Deploy to non-prod

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: non-prod
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing non-prod environment secret DEPLOY_SSH_KEY"
            exit 1
          fi
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing non-prod environment secret DEPLOY_KNOWN_HOSTS"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy develop to sphubsbox.rlsapps.com
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::Missing non-prod environment secret DEPLOY_USER"
            exit 1
          fi
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Missing non-prod environment secret DEPLOY_HOST"
            exit 1
          fi
          ssh -T -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}"
