
name: SupplierHub Backend Unit Tests

on:
  push:
    branches:
      - test/unit-testing

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LIGHTSPEED_VERIFY_INVENTORY_READBACK: "0"

      # Deliberately invalid test-only configuration.
      # No production credentials or database.
      DATABASE_URL: "postgresql://invalid:invalid@127.0.0.1:1/ci_blocked"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov

      - name: Compile critical modules
        run: |
          python -m py_compile lightspeed_service.py
          python -m py_compile multi_family.py
          python -m py_compile single_family.py
          python -m py_compile export_safety.py

      - name: Run P0 safety tests
        run: |
          python -m pytest tests/unit/p0_safety tests/unit/p0_export_recovery tests/unit/p0_inventory -q --tb=short

      - name: Run complete unit suite with coverage
        run: |
          python -m pytest tests/unit -q --tb=short --cov=multi_family --cov=single_family --cov=export_safety --cov=lightspeed_service --cov=inventory_verification --cov=sku_eligibility --cov=pricing_rules --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
